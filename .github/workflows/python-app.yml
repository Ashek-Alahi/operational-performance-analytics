name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate simulated data
        run: python data/generate_data.py --output-dir data/raw
      - name: Generate KPI outputs
        run: python analysis/generate_results.py
      - name: Validate outputs
        run: python analysis/validate_outputs.py
      - name: Run tests
        run: pytest
